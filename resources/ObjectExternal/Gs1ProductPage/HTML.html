<section id="gs1-product-page" class="container-fluid text-center">
    <div class="card mx-auto m-4 p-2">
        <div class="card-body">
            <img class="picture card-img-top" style="display: none;"/>
            <div class="error alert alert-danger" role="alert" style="display: none;"></div>
            <h5 class="card-title label"></h5>
            <div class="card-text description p-2"></div>
            <table class="table table-striped table-bordered">
                <tbody>
                    <tr><th class="text-end">GTIN</th><td class="gtin"></td></tr>
                    <tr><th class="text-end">Lot</th><td class="lot"></td></tr>
                    <tr><th class="text-end">Serial number</th><td class="serial"></td></tr>
                    <tr><th class="text-end">Porduction date</th><td class="productionDate"></td></tr>
                    <tr><th class="text-end">Expiry date</th><td class="expiryDate"></td></tr>
                    <tr><th class="text-end">Software version</th><td class="softwareVersion"></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
