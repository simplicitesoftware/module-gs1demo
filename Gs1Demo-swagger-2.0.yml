securityDefinitions:
  basicAuth:
    type: basic
  bearerAuth:
    in: header
    name: Authorization
    type: apiKey
definitions:
  Error404:
    description: Not found
    type: object
    properties:
      error:
        description: Error message
        type: string
      status:
        description: Error status
        type: integer
        enum:
        - 404
  Gs1Udi:
    description: |-
      Medical device:

      Medical device
      --------------

      A mdeical device is identified by a `UDI` (medical device universal identifier).

      A `UDI` is composed of:

      - a `UDI-DI`: static _device identifier_ (= the GTIN)
      - a `UDI-PI`: _production identifiers_

      ### Digital links syntax

      - in path:
        - `01`: GTIN (key)
        - `10`: batch or lot number (optional)
        - `21`: serial number (optional)
      - in query string:
        - `17`: expiry date (`YYMMDD`, optional)
        - `11`: production date (`YYMMDD`, optional)
        - `8012`: software version (optional)
    type: object
    properties:
      gs1GenLotNumber:
        description: Lot number
        type: string
        maxLength: 20
      gs1GenExpirationDate:
        description: Expiration date
        type: string
        maxLength: 10
        example: yyyy-MM-dd
      gs1UdiSoftwareVersion:
        description: Medical device software version
        type: string
        maxLength: 20
      gs1GenGs1DataMatrixImage:
        description: GS1 data matrix image
        type: object
      gs1GenProductionDate:
        description: Production date
        type: string
        maxLength: 10
        example: yyyy-MM-dd
      gs1UdiGtinId__gs1GtinIdentifier:
        description: GTIN identifier
        type: string
        maxLength: 14
      gs1GenHumanReadableInterpretation:
        description: HRI (human readable interpretation)
        type: string
        maxLength: 100
      gs1GenGs1Data:
        description: GS1 data
        type: string
        maxLength: 100
      gs1GenDigitalLinkQrCodeImage:
        description: Digital link QRCode image
        type: object
      gs1UdiGtinId__gs1GtinLabel:
        description: GTIN label
        type: string
        maxLength: 255
      gs1GenSerialNumber:
        description: Serial number
        type: string
        maxLength: 20
      gs1GenDescription:
        description: Prefix description
        type: string
        maxLength: 1000000
      gs1GenGs1128Image:
        description: GS1 128 barcode image
        type: object
      row_id:
        description: Unique technical row ID
        type: string
        maxLength: 11
      gs1GenDigitalLink:
        description: Digital link
        type: string
        maxLength: 255
      gs1UdiGtinId:
        description: Reference to GTIN
        type: string
        maxLength: 11
  ArrayOfGs1Gtin:
    description: List of GTINs
    type: array
    items:
      $ref: '#/definitions/Gs1Gtin'
  ArrayOfGs1Prefix:
    description: List of Country prefixes
    type: array
    items:
      $ref: '#/definitions/Gs1Prefix'
  Gs1Cpg:
    description: |-
      Consumer product:

      Consumer product
      ----------------

      ### Digital links

      - in path:
        - `01`: GTIN (key)
        - `22`: consumer product variant (optional)
        - `10`: batch or lot number (optional)
        - `21`: serial number (optional)
      - in query string:
        - `17`: expiry date (`YYMMDD`, optional)
        - `15`: best-before date (`YYMMDD`, optional)
        - `11`: production date (`YYMMDD`, optional)
        - `3103`: net weight in kg (numer with 3 decimal places, optional)
    type: object
    properties:
      gs1GenLotNumber:
        description: Lot number
        type: string
        maxLength: 20
      gs1CpgWeight:
        description: Weight
        type: string
        maxLength: 10
      gs1GenExpirationDate:
        description: Expiration date
        type: string
        maxLength: 10
        example: yyyy-MM-dd
      gs1CpgGtinId__gs1GtinIdentifier:
        description: GTIN identifier
        type: string
        maxLength: 14
      gs1CpgGtinId:
        description: GTIN
        type: string
        maxLength: 11
      gs1GenProductionDate:
        description: Production date
        type: string
        maxLength: 10
        example: yyyy-MM-dd
      gs1GenHumanReadableInterpretation:
        description: HRI (human readable interpretation)
        type: string
        maxLength: 100
      gs1GenGs1Data:
        description: GS1 data
        type: string
        maxLength: 100
      gs1GenDigitalLinkQrCodeImage:
        description: Digital link QRCode image
        type: object
      gs1CpgGtinId__gs1GtinEan13Image:
        description: GTIN EAN 13 image
        type: object
      gs1GenSerialNumber:
        description: Serial number
        type: string
        maxLength: 20
      gs1GenDescription:
        description: Prefix description
        type: string
        maxLength: 1000000
      gs1GenBestBeforeDate:
        description: Best before date
        type: string
        maxLength: 10
        example: yyyy-MM-dd
      row_id:
        description: Unique technical row ID
        type: string
        maxLength: 11
      gs1CpgGtinId__gs1GtinLabel:
        description: GTIN label
        type: string
        maxLength: 255
      gs1GenDigitalLink:
        description: Digital link
        type: string
        maxLength: 255
  Gs1Country:
    description: |-
      Country:

      ISO 3166-1 countries
    type: object
    properties:
      gs1CtyCode:
        description: Country code (3 letters)
        type: string
        maxLength: 3
      gs1CtyFlagIcon:
        description: Country flag
        type: object
      gs1CtyName:
        description: Country name
        type: string
        maxLength: 100
      row_id:
        description: Unique technical row ID
        type: string
        maxLength: 11
  ArrayOfGs1Udi:
    description: List of Medical devices
    type: array
    items:
      $ref: '#/definitions/Gs1Udi'
  ArrayOfGs1Cpg:
    description: List of Consumer products
    type: array
    items:
      $ref: '#/definitions/Gs1Cpg'
  TreeviewData:
    type: object
    properties:
      item:
        description: Object item with lists of linked objects' items
        type: object
  ArrayOfGs1Country:
    description: List of Countries
    type: array
    items:
      $ref: '#/definitions/Gs1Country'
  Gs1Prefix:
    description: |-
      Country prefix:

      GS1 prefixes
    type: object
    properties:
      gs1GenDescription:
        description: Prefix description
        type: string
        maxLength: 1000000
      gs1PreCtyId:
        description: Reference to country
        type: string
        maxLength: 11
      row_id:
        description: Unique technical row ID
        type: string
        maxLength: 11
      gs1PrePrefix:
        description: Prefix
        type: string
        maxLength: 3
      gs1PreCtyId__gs1CtyName:
        description: Country name
        type: string
        maxLength: 100
      gs1PreCtyId__gs1CtyCode:
        description: Country code (3 letters)
        type: string
        maxLength: 3
  Gs1Gtin:
    description: |-
      GTIN:

      `GTIN`: Internationally unique product identifier managed by the GS1 Organization
    type: object
    properties:
      gs1GtinPreId:
        description: GTIN reference to contry prefix
        type: string
        maxLength: 11
      gs1GtinUpcaImage:
        description: UPC-A image
        type: object
      gs1GenGs1DataMatrixImage:
        description: GS1 data matrix image
        type: object
      gs1GenHumanReadableInterpretation:
        description: HRI (human readable interpretation)
        type: string
        maxLength: 100
      gs1GtinPicture:
        description: GTIN picture
        type: object
      gs1GtinPreId__gs1PreCtyId__gs1CtyName:
        description: Country name
        type: string
        maxLength: 100
      gs1GenGs1Data:
        description: GS1 data
        type: string
        maxLength: 100
      gs1GenDigitalLinkQrCodeImage:
        description: Digital link QRCode image
        type: object
      gs1GtinEan13Image:
        description: EAN 13 image
        type: object
      gs1GtinType:
        description: GTIN type
        type: string
        maxLength: 50
        enum:
        - MEDICAL_DEVICE
        - CONSUMER_PRODUCT
        - OTHER
      gs1GtinPreId__gs1PrePrefix:
        description: Prefix
        type: string
        maxLength: 3
      gs1GtinPreId__gs1PreCtyId__gs1CtyCode:
        description: Country code (3 letters)
        type: string
        maxLength: 3
      gs1GenDescription:
        description: Prefix description
        type: string
        maxLength: 1000000
      gs1GtinLabel:
        description: GTIN label
        type: string
        maxLength: 255
      gs1GtinPreId__gs1PreCtyId:
        description: Reference to country
        type: string
        maxLength: 11
      row_id:
        description: Unique technical row ID
        type: string
        maxLength: 11
      gs1GtinIdentifier:
        description: GTIN identifier
        type: string
        maxLength: 14
      gs1GenDigitalLink:
        description: Digital link
        type: string
        maxLength: 255
  Error400:
    description: Bad request
    type: object
    properties:
      error:
        description: Error message
        type: string
      status:
        description: Error status
        type: integer
        enum:
        - 400
  Error401:
    description: Unauthorized
    type: object
    properties:
      error:
        description: Error message
        type: string
      status:
        description: Error status
        type: integer
        enum:
        - 401
  Error500:
    description: Internal server error
    type: object
    properties:
      error:
        description: Error message
        type: string
      status:
        description: Error status
        type: integer
        enum:
        - 500
  Error403:
