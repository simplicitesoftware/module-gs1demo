          type: string
          maxLength: 11
        gs1PrePrefix:
          description: Prefix
          type: string
          maxLength: 3
        gs1PreCtyId__gs1CtyName:
          description: Country name
          type: string
          maxLength: 100
        gs1PreCtyId__gs1CtyCode:
          description: Country code (3 letters)
          type: string
          maxLength: 3
    Gs1Gtin:
      description: |-
        GTIN:

        `GTIN`: Internationally unique product identifier managed by the GS1 Organization
      type: object
      properties:
        gs1GtinPreId:
          description: GTIN reference to contry prefix
          type: string
          maxLength: 11
        gs1GtinUpcaImage:
          description: UPC-A image
          type: object
        gs1GenGs1DataMatrixImage:
          description: GS1 data matrix image
          type: object
        gs1GenHumanReadableInterpretation:
          description: HRI (human readable interpretation)
          type: string
          maxLength: 100
        gs1GtinPicture:
          description: GTIN picture
          type: object
        gs1GtinPreId__gs1PreCtyId__gs1CtyName:
          description: Country name
          type: string
          maxLength: 100
        gs1GenGs1Data:
          description: GS1 data
          type: string
          maxLength: 100
        gs1GenDigitalLinkQrCodeImage:
          description: Digital link QRCode image
          type: object
        gs1GtinEan13Image:
          description: EAN 13 image
          type: object
        gs1GtinType:
          description: GTIN type
          type: string
          maxLength: 50
          enum:
          - MEDICAL_DEVICE
          - CONSUMER_PRODUCT
          - OTHER
        gs1GtinPreId__gs1PrePrefix:
          description: Prefix
          type: string
          maxLength: 3
        gs1GtinPreId__gs1PreCtyId__gs1CtyCode:
          description: Country code (3 letters)
          type: string
          maxLength: 3
        gs1GenDescription:
          description: Prefix description
          type: string
          maxLength: 1000000
        gs1GtinLabel:
          description: GTIN label
          type: string
          maxLength: 255
        gs1GtinPreId__gs1PreCtyId:
          description: Reference to country
          type: string
          maxLength: 11
        row_id:
          description: Unique technical row ID
          type: string
          maxLength: 11
        gs1GtinIdentifier:
          description: GTIN identifier
          type: string
          maxLength: 14
        gs1GenDigitalLink:
          description: Digital link
          type: string
          maxLength: 255
