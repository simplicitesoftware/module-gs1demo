components:
  schemas:
    Error404:
      description: Not found
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 404
    Gs1Udi:
      description: |-
        UDI:

        `UDI`: A medical device universal identifier.

        `UDI` = `UDI-DI` (static _device identifier_ = the GTIN) + `UDI-PI` (_production identifiers_)
      type: object
      properties:
        gs1UdiSerialNumber:
          description: Serial number
          type: string
          maxLength: 20
        gs1UdiDigitalLink:
          description: Digital link
          type: string
          maxLength: 255
        gs1UdiGs1DataMatrixImage:
          description: GS1 data matrix image
          type: object
        gs1UdiSoftwareVersion:
          description: Software version
          type: string
          maxLength: 20
        gs1UdiDescription:
          description: Description
          type: string
          maxLength: 1000000
        gs1UdiGtinId__gs1GtinIdentifier:
          description: GTIN Identifier
          type: string
          maxLength: 14
        gs1UdiExpirationDate:
          description: Expiration date
          type: string
          maxLength: 10
          example: yyyy-MM-dd
        gs1UdiHumanReadableInterpretation:
          description: Human readable interpretation (HRI)
          type: string
          maxLength: 100
        gs1UdiGtinId__gs1GtinLabel:
          description: GTIN Label
          type: string
          maxLength: 255
        gs1UdiProductionDate:
          description: Production date
          type: string
          maxLength: 10
          example: yyyy-MM-dd
        gs1UdiDigitalLinkQrCodeImage:
          description: Digital link image
          type: object
        gs1UdiGs1Data:
          description: GS1 data
          type: string
          maxLength: 100
        gs1UdiLotNumber:
          description: Lot number
          type: string
          maxLength: 20
        row_id:
          description: Unique technical row ID
          type: string
          maxLength: 11
        gs1UdiGs1128Image:
          description: GS1 128 image
          type: object
        gs1UdiGtinId:
          description: GTIN
          type: string
          maxLength: 11
    ArrayOfGs1Gtin:
      description: List of GTINs
      type: array
      items:
        $ref: '#/components/schemas/Gs1Gtin'
    ArrayOfGs1Prefix:
      description: List of Country prefixes
      type: array
      items:
        $ref: '#/components/schemas/Gs1Prefix'
    Gs1Country:
      description: |-
        Country:

        ISO 3166-1 countries
      type: object
      properties:
        gs1CtyCode:
          description: Country code (3 letters)
          type: string
          maxLength: 3
        gs1CtyFlagIcon:
          description: Flag
          type: object
        gs1CtyName:
          description: Country name
          type: string
          maxLength: 100
        row_id:
          description: Unique technical row ID
          type: string
          maxLength: 11
    ArrayOfGs1Udi:
      description: List of UDIs
      type: array
      items:
        $ref: '#/components/schemas/Gs1Udi'
    TreeviewData:
      type: object
      properties:
        item:
          description: Object item with lists of linked objects' items
          type: object
    ArrayOfGs1Country:
      description: List of Countries
      type: array
      items:
        $ref: '#/components/schemas/Gs1Country'
    Gs1Prefix:
      description: |-
        Country prefix:

        GS1 prefixes
      type: object
      properties:
        gs1PreDescription:
          description: Description
          type: string
          maxLength: 1000000
        gs1PreCtyId:
          description: Country
          type: string
          maxLength: 11
        row_id:
          description: Unique technical row ID
          type: string
          maxLength: 11
        gs1PrePrefix:
          description: Prefix
          type: string
          maxLength: 3
        gs1PreCtyId__gs1CtyName:
          description: Country name
          type: string
          maxLength: 100
        gs1PreCtyId__gs1CtyCode:
          description: Country code (3 letters)
          type: string
          maxLength: 3
    Gs1Gtin:
      description: |-
        GTIN:

        `GTIN`: Internationally unique product identifier managed by the GS1 Organization
      type: object
      properties:
        gs1GtinPreId:
          description: Prefix
          type: string
          maxLength: 11
        gs1GtinDigitalLinkQrCodeImage:
          description: Digital link image
          type: object
        gs1GtinUpcaImage:
          description: UPC-A image
          type: object
        gs1GtinItf14Image:
          description: ITF14 image
          type: object
        gs1GtinHumanReadableInterpretation:
          description: Human readable interpretation (HRI)
          type: string
          maxLength: 100
        gs1GtinPicture:
          description: Picture
          type: object
        gs1GtinPreId__gs1PreCtyId__gs1CtyName:
          description: Country name
          type: string
          maxLength: 100
        gs1GtinDigitalLink:
          description: Digital link
          type: string
          maxLength: 255
        gs1GtinGs1Data:
          description: GS1 data
          type: string
          maxLength: 100
        gs1GtinEan13Image:
          description: EAN 13 image
          type: object
        gs1GtinDescription:
          description: Description
          type: string
          maxLength: 1000000
        gs1GtinType:
          description: Type
          type: string
          maxLength: 50
          enum:
          - MEDICAL_DEVICE
          - OTHER
        gs1GtinPreId__gs1PrePrefix:
          description: Prefix
          type: string
          maxLength: 3
        gs1GtinPreId__gs1PreCtyId__gs1CtyCode:
          description: Country code (3 letters)
          type: string
          maxLength: 3
        gs1GtinLabel:
          description: Label
          type: string
          maxLength: 255
        gs1GtinPreId__gs1PreCtyId:
          description: Prefix Country
          type: string
          maxLength: 11
        row_id:
          description: Unique technical row ID
          type: string
          maxLength: 11
        gs1GtinIdentifier:
          description: Identifier
          type: string
          maxLength: 14
        gs1GtinGs1DataMatrixImage:
          description: Data matrix image
          type: object
    Error400:
      description: Bad request
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 400
    Error401:
      description: Unauthorized
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 401
    Error500:
      description: Internal server error
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 500
    Error403:
      description: Forbidden
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 403
